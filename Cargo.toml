[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
solidate-core = { path = "crates/solidate-core" }
solidate-db = { path = "crates/solidate-db" }
solidate-app = { path = "crates/solidate-app" }
solidate-mcp = { path = "crates/solidate-mcp" }

blake3 = "1"
comrak = { version = "0.55", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "3"
anyhow = "1"
argon2 = "0.6"
clap = { version = "4", features = ["derive", "env"] }
getrandom = "0.4"
subtle = "2"
walkdir = "2"
dotenvy = "0.15"
tempfile = "3"
topcoat = { version = "0.9", features = ["htmx", "tower"] }
percent-encoding = "2"
thiserror = "2"
http = "1"
rmcp = { version = "3.4", default-features = false, features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
proptest = "1"
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "macros", "migrate", "uuid", "time", "json"] }
time = { version = "0.3", features = ["serde", "formatting"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
uuid = { version = "1", features = ["v7", "serde"] }
