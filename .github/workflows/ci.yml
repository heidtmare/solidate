name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: solidate
          POSTGRES_PASSWORD: solidate
          POSTGRES_DB: solidate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U solidate"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      # Superuser connection: #[sqlx::test] creates a database per test.
      DATABASE_URL: postgres://solidate:solidate@localhost:5432/solidate
    steps:
      - uses: actions/checkout@v5
      # Installs the toolchain and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
