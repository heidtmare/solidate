services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: solidate
      POSTGRES_PASSWORD: solidate
      POSTGRES_DB: solidate
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solidate"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
